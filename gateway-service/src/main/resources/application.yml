server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Route 1 : /calcul/** va vers calcul-service
            - id: route-calcul
              uri: http://localhost:8081
              predicates:
                - Path=/calcul/**
            # Route 2 : /operations/** va vers historique-service
            - id: route-historique
              uri: http://localhost:8082
              predicates:
                - Path=/operations/**
            # Routes 3 et 4 : description OpenAPI pour Swagger UI
            - id: doc-calcul
              uri: http://localhost:8081
              predicates:
                - Path=/docs/calcul
              filters:
                - SetPath=/v3/api-docs
            - id: doc-historique
              uri: http://localhost:8082
              predicates:
                - Path=/docs/historique
              filters:
                - SetPath=/v3/api-docs
    loadbalancer:
      cache:
        ttl: 5s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    registry-fetch-interval-seconds: 5
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: gateway

# Swagger UI de la passerelle : http://localhost:8888/swagger-ui.html
springdoc:
  swagger-ui:
    urls:
      - name: calcul-service
        url: /docs/calcul
      - name: historique-service
        url: /docs/historique